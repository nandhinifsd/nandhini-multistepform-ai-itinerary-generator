<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login In Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <link href="style.css" rel="stylesheet">
    <link href="style1.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
</head>
<body>

     <div class="container-fluid  d-flex justify-content-center align-items-center planurtrip w-100 h-100" id="planUrTrip">
 
        <div class="col-9 col-lg-6 m-0 m-md-1 m-lg-2 p-1 p-md-3 p-lg-5 formdesign justify-content-center" id="signin-form">
  <!-- <div class="container signinform w-100 m-1 p-1" id="signin-form">--> 

        <h1 class="text-start m-1 p-1 heading-font" id="signin-message">SIGN IN</h1>

        <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12">
                <div class="username-container">
                    <label for="username" class="form-label subheading-font text-start d-block mb-3">Phone number or Email ID: </label>
           
            <input type="text" class="form-control"  id="username" placeholder="Enter your Email / Phone Number" required>
                <div class="col-12 h-25"> <small id="username-message"></small>
                </div>
         </div>  
         
            </div>
        </div>

        <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12">
                <div class="password-container">
                    <label for="password" class="form-label subheading-font text-start d-block mb-3">Password: </label>
           
            <input type="password" class="form-control"  id="password" placeholder="Enter your Password" required>
                <div class="col-md-4 h-25"> <small id="validation-message"></small>
                </div>
         </div>  
         
            </div>
        </div>
        
         <div class="row align-items-center mb-1 mt-5 p-1">
            <div class="col-12 d-flex justify-content-center">
                 <button class="btn btn-success btn-lg text-white heading-font actionbutton text-center" id="signin-btn">Signin</button> 
                </div>
                </div>
        <div class="row align-items-center mb-3 mt-1 p-1">
            <div class="col-12 d-flex justify-content-center">
                 <button class="btn btn-success btn-lg text-white subheading-font actionbutton text-center bg-transparent border-0" id="signup-btn"><a href="signup.html"> New User -Sign UP here </a></button> 
                </div>
                </div>

        </div>
</div>   
        
    <!--</div>-->
      
        

 <script src="signinscript.js"></script>   
</body>
</html>
