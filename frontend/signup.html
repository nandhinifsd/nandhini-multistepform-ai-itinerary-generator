<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign up Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <link href="style.css" rel="stylesheet">
    <link href="style1.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-fluid  d-flex justify-content-center align-items-center planurtrip h-100" id="planUrTrip">

  <div class="col-9 col-lg-6 m-0 m-md-1 m-lg-2 p-1 p-md-3 p-lg-5 formdesign justify-content-center" id="signup-form">

        <h1 class="text-start m-1 p-1 heading-font" id="signup-message">Sign up here</h1>
<!--Fullname-->
        <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12 fullname-container d-block">
              
            <label for="fullname" class="form-label subheading-font text-start d-block mb-3">Full Name: </label>
            <input type="text" class="form-control"  id="fullname" placeholder="Enter your Full Name" required>
            <div class="col-md-8 h-25"> <small id="fullname-errmsg"></small>
            </div>  
        </div></div>
        <!--Email-->
         <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12 email-container d-block">
              
            <label for="email" class="form-label subheading-font text-start d-block mb-3">Email Id: </label>
            <input type="email" class="form-control"  id="email" placeholder="Enter your Email Id" required>
            <div class="col-md-8 h-25"> <small id="email-errmsg"></small>
            </div>  
        </div></div>
        <!--Phone-->
         <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12 phone-container d-block">
              
            <label for="phonenum" class="form-label subheading-font text-start d-block mb-3">Phone: </label>
            <input type="tel" class="form-control"  id="phonenum" placeholder="Enter your Phone Number" pattern="[6-9]{1}[0-9]{9}" required>
            <div class="col-md-8 h-25"> <small id="phonenum-errmsg"></small>
            </div>  
        </div></div>
        <!--Password-->
<div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12 password-container d-block">
            <label for="newpassword" class="form-label subheading-font text-start d-block mb-3">Password: </label>
            <input type="password" class="form-control"  id="newpassword" placeholder="Enter your Password" required>
            </div>
            <div class="col-md-8 h-25"> <small id="pwdvalidation-msg"></small>
         </div>  </div>
         <!--confrim password--->
         <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12 confrim-password-container d-block">
            <label for="confrimpassword" class="form-label subheading-font text-start d-block mb-3">Confrim Password: </label>
            <input type="password" class="form-control"  id="confrimpassword" placeholder="Reenter your Password" required>
            </div>
            <div class="col-md-8 h-25"> <small id="cnfpwdvalidation-msg"></small>
         </div>  </div>
          <div class="row align-items-center mb-1 mt-1 p-1">
            <div class="col-12 confrim-password-container d-block">
                 <input class="form-check-input mt-1 me-1" type="checkbox" id="terms" value="agree" aria-label="Checkbox for terms and condition agreement">
                 <label class="form-check-label subheading-font" for="terms">I agree with terms and conditions</label>
                  <div class="col-md-4 h-25"> <small id="checkterms-msg"></small>
  </div>

                </div>
        <!--buttons-->
         <div class="row align-items-center mb-1 mt-5 p-1">
            <div class="col-12 col-md-6 d-flex justify-content-center mt-1 mb-1">
                 <button class="btn btn-success btn-lg text-white heading-font actionbutton text-center" type="submit" id="signup-btn">Sign Up</button> 
                </div>
                <div class="col-12 col-md-6 d-flex justify-content-center mt-1 mb-1">
                 <button class="btn btn-warning btn-lg text-white heading-font actionbutton text-center" id="reset-btn">Reset</button> 
                </div>
                </div>
        

        </div>
    </div>
      
        

 <script src="signupscript.js"></script>   
</body>
</html>
